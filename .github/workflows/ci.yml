name: CI - kiem tra code

# Chay tu dong khi push/PR tren may Linux (re, nhanh) de bat loi som
# truoc khi ton thoi gian may Mac build iOS.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Phan tich code (chi that bai khi co loi that su)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Chay unit test
        run: flutter test
