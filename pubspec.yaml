name: hapy
description: Hapy - ứng dụng học tập vui cho trẻ em (nhiều bé, nhiều từ điển, nhắc việc).
publish_to: "none"
version: 2.1.0+3

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  flutter_tts: ^4.0.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  flutter_timezone: ^2.1.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  http: ^1.2.2
  speech_to_text: ^7.0.0
  pinyin: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
